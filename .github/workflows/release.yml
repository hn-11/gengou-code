# Tag push (v*) -> full assembly from live upstreams (5 weights x 2 styles
# x 2 families = 20 faces plus the 10 Gengou Code statics and the two
# variable fonts), verify, graft the Nerd Fonts symbols into everything,
# zip, GitHub release.
# Gengou Code itself ships as the two variable fonts (its statics are the
# JP faces' donors, the Nerd Fonts patch's input and the variable fonts'
# check, not an asset); the JP families ship as statics, one zip per
# family (and per family for their Nerd Fonts patches: a download is the
# family a user installs). No collections: the release unit is the file
# a user installs.
#
# A family's weights per job — its Latin donors, its JP faces, their
# Nerd Fonts patches and a share of the Gengou Code ones (patched while
# the JP faces build), verified side by side and uploaded as an
# artifact; the package job assembles dist/ from the artifacts (each
# Latin face already carries its pinned win metrics from the job that
# built it, so nothing here needs to touch or re-verify them), zips and
# publishes.
name: Release
on:
  push:
    tags: ["v*"]
    # a branch push whose commit message carries [release-dry] is a dry
    # run: the workflow as of that commit builds and packages, publishes
    # nothing — timing a change to this file before it is on main (a push
    # without the marker runs nothing; workflow_dispatch is not open to
    # every token)
    branches: ["**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v2.4.0)"
        required: true
      dry-run:
        description: "Build and package only: no tag, no release (timing the workflow)"
        type: boolean
        default: false
permissions:
  contents: write
env:
  GENGOU_VERSION_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.0.0-dry' }}
  # the runs that publish: a v* tag, or a dispatch without dry-run
  PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' && !inputs.dry-run }}
jobs:
  # a family's weights, both styles, per job (six jobs): its Latin donors,
  # its JP faces and their Nerd Fonts grafts. The two Bold jobs (two faces
  # each, the lightest) also build one variable font each and graft the
  # symbols into it, for the package job to verify against every static
  # and ship
  faces:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-dry]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # by style, not by family: each job builds a weight's faces in
      # BOTH families, so every Term face has the JP face it is widened
      # from beside it and verify_jp.check_term_sibling runs (a
      # family-split matrix never gave it a sibling, so it reported
      # "skipped" on every release; round 11). Six jobs and twenty
      # faces either way -- four, four and two per style.
      matrix:
        style: [Upright, Italic]
        weights: [Light Regular, Medium SemiBold, Bold]
        include:
          - style: Upright
            weights: Bold
            variable: upright
          - style: Italic
            weights: Bold
            variable: italic
    name: faces (${{ matrix.style }} ${{ matrix.weights }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
      - run: echo "GENGOU_VERSION=${GENGOU_VERSION_TAG#v}" >> "$GITHUB_ENV"
      - run: python scripts/build_latin.py "${{ matrix.weights }}"
      - name: Build the JP faces and graft the symbols into them
        run: |
          python scripts/build.py "${{ matrix.weights }} ${{ matrix.style }} base Term"
          python scripts/nerdpatch.py dist/*.otf
      - if: matrix.variable
        name: Build the variable font and graft the symbols into it
        run: |
          python scripts/build_latin_vf.py ${{ matrix.variable }}
          python scripts/nerdpatch.py dist/latin/*\[wght\].otf
      # the statics only: a variable font is held to every static of its
      # family (verify_latin_vf), and only the package job has them all
      - run: |
          statics=$(ls dist/latin/GengouCode-*.otf | grep -v '\[wght\]')
          python scripts/verify.py 'dist/*.otf' 'dist/nerd/*.otf' $statics
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: faces-${{ matrix.style }}-${{ strategy.job-index }}
          path: |
            dist/*.otf
            dist/latin/*.otf
            dist/nerd/*.otf
            dist/nerd/latin/*.otf
          if-no-files-found: error
          retention-days: 7
  # the faces and the variable fonts from the artifacts, then the zips
  # and the release
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: faces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # the same stamp the faces job built with: this job verifies the
      # assembled dist/ before zipping it, and without this its
      # verifiers skipped the version check and a dist/ carrying two
      # versions would have shipped
      - run: echo "GENGOU_VERSION=${GENGOU_VERSION_TAG#v}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: faces-*
          path: dist
          merge-multiple: true
      - name: Verify the variable fonts against the static faces
        run: |
          python scripts/verify.py \
            "dist/latin/GengouCode[wght].otf" "dist/latin/GengouCode-Italic[wght].otf" \
            "dist/nerd/latin/GengouCodeNF[wght].otf" "dist/nerd/latin/GengouCodeNF-Italic[wght].otf"
      - run: |
          cp LICENSE dist/LICENSE
          cp LICENSE dist/nerd/LICENSE
          cp LICENSE dist/latin/LICENSE
          cp LICENSE dist/nerd/latin/LICENSE
          # the Nerd Fonts symbols' own license rides with the faces that carry them
          cp "$NF_LICENSE" dist/nerd/LICENSE-NerdFonts
          cp "$NF_LICENSE" dist/nerd/latin/LICENSE-NerdFonts
          # one zip per family: "GengouCodeJP-*" is the base family alone
          # (Term carries its own prefix)
          cd dist
          for fam in GengouCodeJP GengouCodeJPTerm; do
            zip -q "$fam.zip" "$fam"-*.otf LICENSE
            (cd nerd && zip -q "../$fam-NerdFont.zip" "$fam"NF-*.otf LICENSE LICENSE-NerdFonts)
          done
          (cd latin && zip -q ../GengouCode.zip 'GengouCode[wght].otf' 'GengouCode-Italic[wght].otf' LICENSE)
          (cd nerd/latin && zip -q ../../GengouCode-NerdFont.zip \
            'GengouCodeNF[wght].otf' 'GengouCodeNF-Italic[wght].otf' LICENSE LICENSE-NerdFonts)
      # every asset, on a dry run too (a missing one is a failure here, not
      # a warning from the release step). By name and by content: `zip`
      # exits 0 when its *.otf argument matches nothing, because LICENSE
      # always matches, so `ls` alone would have shipped a zip holding
      # two licence files and no font
      - name: Every release asset exists and carries its fonts
        run: |
          want="GengouCodeJP:10 GengouCodeJPTerm:10 GengouCode:2
                GengouCodeJP-NerdFont:10 GengouCodeJPTerm-NerdFont:10
                GengouCode-NerdFont:2"
          for spec in $want; do
            zip="dist/${spec%%:*}.zip"
            n="${spec##*:}"
            [ -f "$zip" ] || { echo "::error::$zip missing"; exit 1; }
            got=$(unzip -Z1 "$zip" | grep -c '\.otf$' || true)
            [ "$got" = "$n" ] || { echo "::error::$zip has $got fonts, want $n"; exit 1; }
          done
          ls -l dist/*.zip
      - if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # on dispatch the tag doesn't exist yet; gh-release creates it
          # at the built commit. Tag pushes keep working unchanged.
          tag_name: ${{ env.GENGOU_VERSION_TAG }}
          target_commitish: ${{ github.sha }}
          # the notes are the merged pull requests since the last tag:
          # this project keeps no hand-written changelog (the ones up to
          # v5.0.0 are on their own release pages, and the file they came
          # from is in the history at `git show v5.0.0:CHANGELOG.md`)
          generate_release_notes: true
          files: |
            dist/GengouCodeJP.zip
            dist/GengouCodeJPTerm.zip
            dist/GengouCodeJP-NerdFont.zip
            dist/GengouCodeJPTerm-NerdFont.zip
            dist/GengouCode.zip
            dist/GengouCode-NerdFont.zip
