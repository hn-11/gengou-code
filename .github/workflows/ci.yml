# Gate for every push/PR, in about a minute: the Regular faces (upright
# and italic) and the Light Italic faces (the erosion path) of both
# families, the variable Gengou and the Nerd Fonts graft, assembled from
# the live upstreams in eight parallel jobs (around ten, jobs start to
# queue behind each other and finish late). upstream-sync.yml waits on
# these jobs by name (REQUIRED_CHECKS there): renaming one here means
# renaming it there. The full 20-face build happens in release.yml.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  # upstream-sync.yml dispatches this on its own branch: a pull_request run
  # for a bot-opened PR lands in action_required, so the checks that gate the
  # merge have to come from a run this repo started itself.
  workflow_dispatch:
jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff pytest
      - run: ruff check scripts/ tests/
      - run: python -m pytest tests/ -q
  # one weight and style per job, BOTH families: the Latin donor
  # (build_latin.py), then the JP face and its Term sibling on top
  # (build.py), then all of them verified side by side; the Regular
  # Upright job also grafts the Nerd Fonts symbols into the JP faces
  # (nerdpatch.py) and verifies that.
  #
  # The two families build in one job because two of the gates compare
  # a face with its sibling -- the Term face against the JP one it is
  # widened from (verify_jp.check_term_sibling, 14,345 glyphs) and every
  # face's cmap against its family's Regular (check_family_cmap) -- and
  # a job that builds one family has no sibling to compare against, so
  # both gates reported "skipped" on every run they ever made (round
  # 11). Three jobs instead of six, each one JP face longer.
  faces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        face: [Regular Upright, Regular Italic, Light Italic]
        include:
          - face: Regular Upright
            nerd: "true"
          # the Light Italic job builds the Latin Regular Italic as
          # well, so that check_family_cmap has the face it compares
          # against. It is the Regular of the face's own family AND
          # style, and a matrix split by style never had one beside the
          # face, so the gate skipped on every run it ever made (round
          # 12). A Latin static is seconds; a JP one is a minute, so
          # the JP families still compare only in the release, whose
          # jobs build a family's two weights each
          - face: Light Italic
            latin: Light Regular Italic
    name: faces (${{ matrix.face }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
      # the Latin layer (Gengou) is assembled first
      # from the VFs; build.py grafts it into Source Han Sans
      - run: python scripts/build_latin.py "${{ matrix.latin || matrix.face }}"
      - run: python scripts/build.py "${{ matrix.face }} base Term"
      - if: matrix.nerd
        run: python scripts/nerdpatch.py dist/*.otf
      - run: python scripts/verify.py 'dist/latin/*.otf' 'dist/*.otf' 'dist/nerd/*.otf'
  # the variable Gengou, BOTH styles. The italic is where every piece of
  # the second donor lives -- the Source Sans masters, the imported
  # anchors, the fitted ones, the varLib merge of anchors that differ
  # per master -- and building only the upright meant that code first
  # ran on a release tag, so an incompatibility failed the release
  # rather than the pull request. (verify_latin_vf.py's static-face
  # comparison skips when dist/latin has no statics; its check against
  # Source Code Pro itself still runs.) Then nerdpatch.py on the Gengou
  # Regular face (the complete symbol set: the graft takes seconds)
  variable-nerd-font:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: variable + Nerd Font
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
      - run: python scripts/build_latin_vf.py
      - run: >-
          python scripts/verify.py
          "dist/latin/Gengou[wght].otf" "dist/latin/Gengou-Italic[wght].otf"
      - run: python scripts/build_latin.py "Regular Upright"
      - run: python scripts/nerdpatch.py dist/latin/Gengou-Regular.otf
      - run: python scripts/verify.py dist/nerd/latin/GengouNF-Regular.otf
